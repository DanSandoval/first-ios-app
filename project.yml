name: FirstApp

options:
  bundleIdPrefix: com.dansandoval
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Project-level settings. Signing is deliberately absent: CI builds unsigned and
# passes CODE_SIGNING_ALLOWED=NO / CODE_SIGNING_REQUIRED=NO on the command line.
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  FirstApp:
    type: application
    platform: iOS
    sources:
      - path: FirstApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dansandoval.firstiosapp
        # No spaces: the artifact is FirstApp.app so CI paths stay space-free.
        # The home-screen name comes from CFBundleDisplayName below.
        PRODUCT_NAME: FirstApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: "NO"
    # Explicit plist: do not add GENERATE_INFOPLIST_FILE or INFOPLIST_KEY_* here.
    info:
      path: FirstApp/Info.plist
      properties:
        CFBundleDisplayName: First iOS App
        # Required by BiometricGate. Face ID without this key does not fail
        # gracefully - iOS terminates the process on the first evaluation.
        # Touch ID needs no key, which is why the omission survives testing
        # on a Touch ID device or the Simulator and only bites on real Face
        # ID hardware. This string is what the system prompt shows the user.
        NSFaceIDUsageDescription: Unlock to view your saved API token.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Required, even empty: without it the app runs letterboxed in
        # iPhone-compatibility mode instead of filling a modern screen.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  # XCTest bundle. The dependency on FirstApp is what makes `@testable import
  # FirstApp` work: XcodeGen sets TEST_HOST automatically for a unit-test
  # target that depends on an application, and the bundle.unit-test preset
  # points BUNDLE_LOADER at it.
  FirstAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FirstAppTests
    dependencies:
      - target: FirstApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dansandoval.firstiosapp.tests
        # Synthesised plist: a test bundle has nothing to declare, unlike the
        # app target above, which needs a hand-written one.
        GENERATE_INFOPLIST_FILE: "YES"

# Declared explicitly rather than relying on implicit scheme generation, because
# CI passes `-scheme FirstApp` and the build fails outright if it is missing.
schemes:
  FirstApp:
    build:
      targets:
        FirstApp: all
    run:
      config: Debug
    # Debug, not Release: ENABLE_TESTABILITY is on by default only in Debug,
    # and `@testable import` needs it.
    test:
      config: Debug
      targets:
        - FirstAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
